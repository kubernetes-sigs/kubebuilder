{{- if and .Values.prometheus.enabled .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- $labels := .Values.prometheus.labels | default dict }}
    {{- if not (hasKey $labels "app.kubernetes.io/managed-by") }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- end }}
    {{- if not (hasKey $labels "app.kubernetes.io/name") }}
    app.kubernetes.io/name: {{ include "project-v4-with-plugins.name" . }}
    {{- end }}
    {{- if not (hasKey $labels "helm.sh/chart") }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    {{- end }}
    {{- if not (hasKey $labels "app.kubernetes.io/instance") }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- if not (hasKey $labels "control-plane") }}
    control-plane: controller-manager
    {{- end }}
    {{- with .Values.prometheus.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheus.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "project-v4-with-plugins.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - {{- if .Values.metrics.secure }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    path: /metrics
    port: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    {{- if .Values.metrics.secure }}
    tlsConfig:
      serverName: {{ include "project-v4-with-plugins.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}.{{ .Release.Namespace }}.svc
      {{- if .Values.certManager.enabled }}
      ca:
        secret:
          name: metrics-server-cert
          key: ca.crt
      cert:
        secret:
          name: metrics-server-cert
          key: tls.crt
      keySecret:
        name: metrics-server-cert
        key: tls.key
      {{- else }}
      insecureSkipVerify: true
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "project-v4-with-plugins.name" . }}
      control-plane: controller-manager
{{- end }}
