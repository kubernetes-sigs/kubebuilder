name: Cross-Platform Tests

# Trigger the workflow on pull requests and direct pushes to any branch
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # ENVTEST option to allow kube-apiserver to drain connections gracefully.
      # GitHub runners (mostly macOS) can exceed the 20s default during teardown.
      # DEBUG(#5804): the 6m experiment proved the apiserver never starts shutting
      # down on these runners (no drain), so a long timeout only slows the job.
      KUBEBUILDER_CONTROLPLANE_STOP_TIMEOUT: 2m
      # ENVTEST option to stream kube-apiserver/etcd output into the test logs,
      # so teardown issues on the runners can be diagnosed.
      KUBEBUILDER_ATTACH_CONTROL_PLANE_OUTPUT: "true"
    strategy:
      # Keep the other OS jobs running when one fails, so it is possible to
      # tell whether a failure is specific to a single runner.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    # Pull requests from the same repository won't trigger this checks as they were already triggered by the push
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # This step is needed as the following one tries to remove
      # kustomize for each test but has no permission to do so
      - name: Remove pre-installed kustomize
        run: sudo rm -f /usr/local/bin/kustomize

      # DEBUG(#5804): identity-lease creation fails when the hostname exceeds the
      # 63-byte label limit; record each runner's hostname for the investigation.
      - name: Show runner hostname
        run: hostname && hostname | wc -c

      # DEBUG(#5804) experiment: prove the teardown hang follows the hostname
      # length, not the OS or the darwin binaries. With a >63-byte hostname, the
      # ubuntu job should fail exactly like the macOS one. Remove before merging.
      - name: Set long hostname (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo hostname iad20-fj925-1e765033-cd01-40bb-b570-4dc95f1a1c65-3E9965871810.local
          hostname && hostname | wc -c

      - name: Unit Tests
        run: make test-unit

      - name: Run Testdata
        run: make test-testdata

      # DEBUG(#5804): shutdown-phase logs from the project-v4 controller suite.
      # Print the complete SIGQUIT goroutine dump (the watchdog fires 90s after
      # SIGTERM); fall back to the log tail when no dump happened.
      - name: kube-apiserver debug log
        if: always()
        run: |
          LOG="${TMPDIR:-/tmp}/kube-apiserver-debug.log"
          if grep -q "SIGQUIT: quit" "$LOG" 2>/dev/null; then
            awk '/SIGQUIT: quit/{f=1} f' "$LOG" | head -c 8000000
          else
            tail -c 300000 "$LOG" || true
          fi
