name: Govulncheck

on:
  pull_request:
    branches:
      - master
  schedule:
    # Daily 08:00 UTC — catches new CVEs in the DB when no PRs run the check.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use Makefile GO_VERSION (not go.mod) so stdlib CVE fixes can land without
      # raising the go directive required by library consumers. Same pattern as
      # Cluster API: make go-version → setup-go.
      - name: Calculate go version
        id: vars
        run: echo "go_version=$(make go-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.vars.outputs.go_version }}

      # Use the Makefile target (GOVULNCHECK_VERSION) instead of golang/govulncheck-action, which
      # installs govulncheck@latest and can disagree with local `make govulncheck`.
      - name: Run govulncheck
        run: make govulncheck
