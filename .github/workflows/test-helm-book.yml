name: Helm Docs Tutorials

on:
  push:
    paths:
      - "docs/book/src/cronjob-tutorial/testdata/project/**"
      - "docs/book/src/getting-started/testdata/project/**"
      - "docs/book/src/multiversion-tutorial/testdata/project/**"
      - ".github/workflows/test-helm-book.yml"
  pull_request:
    paths:
      - "docs/book/src/cronjob-tutorial/testdata/project/** "
      - "docs/book/src/getting-started/testdata/project/**"
      - "docs/book/src/multiversion-tutorial/testdata/project/**"
      - ".github/workflows/test-helm-book.yml"

permissions: {}

jobs:
  helm-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        folder: [
          "docs/book/src/getting-started/testdata/project",
          "docs/book/src/cronjob-tutorial/testdata/project",
          "docs/book/src/multiversion-tutorial/testdata/project"
        ]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Runs the same steps as the scaffolded test-chart.yml
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    env:
      IMG: controller:latest
      CERT_MANAGER_VERSION: v1.21.3
      PROMETHEUS_OPERATOR_CRDS_VERSION: 32.0.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        working-directory: .
        run: |
          make kind
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare project
        run: |
          go mod tidy
          make docker-build
          kind load docker-image "$IMG"

      - name: Install Helm
        run: |
          make helm
          # Use the Helm installed by make helm in the next steps
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Lint Helm Chart
        run: helm lint ./dist/chart

      - name: Install cert-manager via Helm (wait for readiness)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --version ${CERT_MANAGER_VERSION} \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 300s

      - name: Install Prometheus Operator CRDs
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus-crds prometheus-community/prometheus-operator-crds \
            --version ${PROMETHEUS_OPERATOR_CRDS_VERSION}

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status
