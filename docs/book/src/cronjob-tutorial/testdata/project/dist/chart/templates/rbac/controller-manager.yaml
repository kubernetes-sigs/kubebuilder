{{- if .Values.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- $labels := .Values.serviceAccount.labels | default dict }}
    {{- if not (hasKey $labels "app.kubernetes.io/managed-by") }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- end }}
    {{- if not (hasKey $labels "app.kubernetes.io/name") }}
    app.kubernetes.io/name: {{ include "project.name" . }}
    {{- end }}
    {{- if not (hasKey $labels "helm.sh/chart") }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    {{- end }}
    {{- if not (hasKey $labels "app.kubernetes.io/instance") }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "project.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
