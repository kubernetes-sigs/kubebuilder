{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "project.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "project.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "project.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "project.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:{{ .Values.manager.healthProbe.port }}
        {{- range .Values.manager.args }}
        - {{ tpl . $ }}
        {{- end }}
        command:
        - /manager
        image: "{{ .Values.manager.image.repository | default "controller" }}{{- if not (contains "@" (.Values.manager.image.repository | default "controller")) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.manager.healthProbe.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: {{ .Values.manager.healthProbe.port }}
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.manager.healthProbe.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 10 }}
          {{- else }}
          []
          {{- end }}
        {{- if not (or (kindIs "invalid" .Values.manager.env) (kindIs "slice" .Values.manager.env)) }}
        {{- fail (printf "manager.env must be a list of environment variables, got a %s. Set one variable with --set manager.envOverrides.NAME=value" (kindOf .Values.manager.env)) }}
        {{- end }}
        {{- if not (or (kindIs "invalid" .Values.manager.envOverrides) (kindIs "map" .Values.manager.envOverrides)) }}
        {{- fail (printf "manager.envOverrides must be a map keyed by variable name, got a %s" (kindOf .Values.manager.envOverrides)) }}
        {{- end }}
        {{- $byName := dict }}
        {{- $order := list }}
        {{- range $entry := .Values.manager.env }}
        {{- if not (kindIs "map" $entry) }}
        {{- fail (printf "manager.env entries must be maps with a name, got a %s" (kindOf $entry)) }}
        {{- end }}
        {{- $name := get $entry "name" }}
        {{- if not (and (kindIs "string" $name) $name) }}
        {{- fail "every manager.env entry needs a non-empty name" }}
        {{- end }}
        {{- if not (hasKey $byName $name) }}
        {{- $order = append $order $name }}
        {{- end }}
        {{- $_ := set $byName $name $entry }}
        {{- end }}
        {{- range $name, $value := .Values.manager.envOverrides }}
        {{- if kindIs "invalid" $value }}
        {{- $_ := unset $byName $name }}
        {{- else if or (kindIs "map" $value) (kindIs "slice" $value) }}
        {{- fail (printf "manager.envOverrides.%s must be a scalar or null, got a %s. A valueFrom entry belongs on manager.env" $name (kindOf $value)) }}
        {{- else }}
        {{- $_ := set $byName $name (dict "name" $name "value" (toString $value)) }}
        {{- end }}
        {{- end }}
        {{- $envVars := list }}
        {{- range $name := $order }}
        {{- if hasKey $byName $name }}
        {{- $envVars = append $envVars (get $byName $name) }}
        {{- end }}
        {{- end }}
        {{- range $name := (keys $byName | sortAlpha) }}
        {{- if not (has $name $order) }}
        {{- $envVars = append $envVars (get $byName $name) }}
        {{- end }}
        {{- end }}
        {{- with $envVars }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "project.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 8 }}
        {{- else }}
        []
        {{- end }}
{{- end }}
